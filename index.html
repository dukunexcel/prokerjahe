<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proker Dashboard - Zanjabila</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .proker-card { transition: all 0.3s ease; border-left: 5px solid #e2e8f0; }
        .proker-card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .status-berjalan { border-left-color: #3b82f6; }
        .status-rencana { border-left-color: #94a3b8; }
        .status-selesai { border-left-color: #10b981; }
        .loading-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    </style>
</head>
<body class="bg-slate-50 p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <div class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-bold text-slate-800 tracking-tight">Dashboard Proker Real-Time</h1>
                <p class="text-slate-500">Data diambil langsung dari Google Sheets</p>
            </div>
            <div id="stats-container" class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center gap-4">
                <div class="text-sm font-medium text-slate-400">Loading Data...</div>
            </div>
        </div>

        <div id="proker-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-2xl h-40 loading-pulse"></div>
            <div class="bg-white p-6 rounded-2xl h-40 loading-pulse"></div>
        </div>

        <div class="mt-12 text-center text-slate-400 text-xs">
            <p>Terakhir diperbarui: <span id="last-update">-</span></p>
            <p class="mt-2">&copy; 2026 Zanjabila Project</p>
        </div>
    </div>

    <script>
        // GANTI LINK DI BAWAH INI DENGAN LINK CSV HASIL "PUBLISH TO WEB" ANDA
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR_MAs87y_X9nK7D08u6LOnK5q7U4ClyA-3w9N1-yI9P7kXyX7E6U-S8D9O3C2E1W0F1G2H3I4J5K6L/pub?gid=1294562959&single=true&output=csv';

        async function initDashboard() {
            try {
                const response = await fetch(SHEET_CSV_URL);
                const data = await response.text();
                const rows = data.split('\n').slice(1); // Lewati header

                const grid = document.getElementById('proker-grid');
                const stats = document.getElementById('stats-container');
                grid.innerHTML = ''; // Kosongkan loading

                let countBerjalan = 0;

                rows.forEach(row => {
                    // Membersihkan karakter aneh dan membagi kolom
                    const cols = row.split(',').map(c => c.trim().replace(/"/g, ''));
                    
                    if (cols.length < 2) return; // Lewati baris kosong

                    const [nama, periode, status, kendala, rating] = cols;
                    
                    if (status.toLowerCase() === 'berjalan') countBerjalan++;

                    // Generate Stars
                    let stars = '';
                    const r = parseInt(rating) || 0;
                    for(let i=1; i<=5; i++) {
                        stars += `<i class="${i <= r ? 'fas' : 'far'} fa-star text-amber-400 text-xs"></i>`;
                    }

                    // Card Template
                    const card = `
                        <div class="proker-card ${status.toLowerCase() === 'berjalan' ? 'status-berjalan' : 'status-rencana'} bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                            <div class="flex justify-between items-start mb-4">
                                <span class="px-2 py-1 ${status.toLowerCase() === 'berjalan' ? 'bg-blue-50 text-blue-600' : 'bg-slate-100 text-slate-500'} text-[10px] font-bold rounded uppercase tracking-wider">${status}</span>
                                <div class="flex gap-0.5">${stars}</div>
                            </div>
                            <h3 class="text-lg font-bold text-slate-800 leading-snug mb-1">${nama}</h3>
                            <p class="text-sm text-slate-500 mb-4"><i class="far fa-calendar-alt mr-2 text-slate-400"></i>${periode || 'TBD'}</p>
                            
                            ${kendala && kendala !== '-' ? `
                                <div class="mt-3 p-3 bg-red-50 border border-red-100 rounded-lg">
                                    <p class="text-[10px] text-red-600 font-bold uppercase mb-1">Kendala:</p>
                                    <p class="text-xs text-red-800">${kendala}</p>
                                </div>
                            ` : ''}
                        </div>
                    `;
                    grid.innerHTML += card;
                });

                // Update Stats
                stats.innerHTML = `
                    <div class="text-right">
                        <p class="text-[10px] text-slate-400 uppercase font-bold tracking-widest">Total / Aktif</p>
                        <p class="text-xl font-black text-slate-800">${rows.length} <span class="text-blue-500">/ ${countBerjalan}</span></p>
                    </div>
                    <div class="h-8 w-[1px] bg-slate-200"></div>
                    <i class="fas fa-sync-alt text-blue-500"></i>
                `;
                document.getElementById('last-update').innerText = new Date().toLocaleTimeString('id-ID');

            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('proker-grid').innerHTML = '<p class="text-red-500">Gagal memuat data. Pastikan link CSV sudah benar dan dipublish ke web.</p>';
            }
        }

        initDashboard();
        // Refresh otomatis setiap 5 menit
        setInterval(initDashboard, 300000);
    </script>
</body>
</html>

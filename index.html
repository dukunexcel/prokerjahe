<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proker Dashboard - Zanjabila</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.5); }
        .proker-card { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .proker-card:hover { transform: scale(1.02) translateY(-5px); }
        .loader { border-top-color: #3b82f6; animation: spinner 1s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-4 md:p-12 min-h-screen bg-slate-50">

    <div class="max-w-7xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 gap-6">
            <div>
                <h1 class="text-4xl font-extrabold text-slate-900 tracking-tight">Monitoring Program Kerja</h1>
                <div class="flex items-center gap-2 mt-2">
                    <span class="relative flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
                    </span>
                    <p class="text-slate-500 text-sm font-medium">Live Data dari Google Sheets</p>
                </div>
            </div>
            <div id="summary-box" class="flex gap-4">
                </div>
        </header>

        <div id="loading-state" class="flex flex-col items-center justify-center py-20">
            <div class="loader ease-linear rounded-full border-4 border-t-4 border-slate-200 h-10 w-10 mb-4"></div>
            <p class="text-slate-400 font-medium animate-pulse">Menghubungkan ke Spreadsheet...</p>
        </div>

        <div id="dashboard-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
            </div>

        <footer class="mt-16 text-center text-slate-400 text-xs font-medium">
            <p>Zanjabila Project &bull; <span id="timestamp"></span></p>
        </div>
    </div>

    <script>
        // ID Spreadsheet dan Nama Sheet
        const ssId = '1PVfLmH2ydZDI8VczsXH-PmDu07it7iVgTiwCVE7Z27E';
        const sheetName = 'PROKER'; // Pastikan nama sheet sesuai (Case Sensitive)
        const url = `https://docs.google.com/spreadsheets/d/${ssId}/gviz/tq?tqx=out:json&sheet=${sheetName}`;

        async function fetchSheetData() {
            try {
                const response = await fetch(url);
                const text = await response.text();
                // Bersihkan respons Google Viz API menjadi JSON valid
                const jsonData = JSON.parse(text.substr(47).slice(0, -2));
                renderDashboard(jsonData.table.rows);
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('loading-state').innerHTML = `
                    <div class="text-center p-6 bg-red-50 rounded-xl border border-red-100 text-red-600">
                        <p class="font-bold">Gagal memuat data.</p>
                        <p class="text-sm mt-1">Pastikan akses link Spreadsheet diset ke "Anyone with the link".</p>
                    </div>`;
            }
        }

        function renderDashboard(rows) {
            const grid = document.getElementById('dashboard-grid');
            const summary = document.getElementById('summary-box');
            const loading = document.getElementById('loading-state');
            
            grid.innerHTML = '';
            let totalActive = 0;

            rows.forEach((row) => {
                // === PEMETAAN KOLOM YANG DIPERBAIKI ===
                // Kolom 0: ID, Kolom 1: No (Dilewati)
                const periode = row.c[2] ? row.c[2].v : '-';        // Kolom C
                const program = row.c[3] ? row.c[3].v : 'Tanpa Nama'; // Kolom D
                const status  = row.c[4] ? row.c[4].v : 'Rencana';  // Kolom E
                const kendala = row.c[5] ? row.c[5].v : null;       // Kolom F
                // Kolom 6 (Solusi) & 7 (Saran) belum ditampilkan, bisa ditambah jika perlu
                const rating  = row.c[8] ? row.c[8].v : 0;          // Kolom I

                // Hitung status aktif
                if(status && status.toLowerCase().includes('berjalan')) totalActive++;

                // Render Bintang
                let stars = '';
                const ratingNum = parseFloat(rating) || 0;
                for(let i=1; i<=5; i++) {
                    if (i <= ratingNum) {
                        stars += `<i class="fas fa-star text-amber-400 text-xs"></i>`;
                    } else {
                        stars += `<i class="far fa-star text-slate-300 text-xs"></i>`;
                    }
                }

                // Warna Status Badge
                let badgeClass = 'bg-slate-100 text-slate-500';
                if(status && status.toLowerCase().includes('berjalan')) badgeClass = 'bg-blue-50 text-blue-600 border border-blue-100';
                if(status && status.toLowerCase().includes('selesai')) badgeClass = 'bg-emerald-50 text-emerald-600 border border-emerald-100';

                const card = `
                    <div class="proker-card glass-card rounded-2xl p-6 shadow-sm flex flex-col justify-between h-full relative overflow-hidden">
                        <div class="absolute -right-6 -top-6 w-24 h-24 bg-gradient-to-br from-slate-100 to-transparent rounded-full opacity-50 pointer-events-none"></div>

                        <div>
                            <div class="flex justify-between items-start mb-4">
                                <span class="px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider ${badgeClass}">
                                    ${status}
                                </span>
                                <div class="flex gap-1 bg-slate-50 px-2 py-1 rounded-lg border border-slate-100">${stars}</div>
                            </div>
                            
                            <h3 class="text-lg font-bold text-slate-800 leading-snug mb-2">${program}</h3>
                            
                            <div class="flex items-center text-slate-500 text-xs font-medium mb-5 bg-slate-50 w-fit px-3 py-1.5 rounded-lg">
                                <i class="far fa-calendar-alt mr-2 text-slate-400"></i>
                                Periode: ${periode}
                            </div>
                        </div>

                        ${kendala && kendala !== '-' ? `
                            <div class="bg-rose-50 border border-rose-100 p-3 rounded-xl mt-auto">
                                <div class="flex items-center gap-2 mb-1">
                                    <i class="fas fa-exclamation-circle text-rose-500 text-xs"></i>
                                    <p class="text-[10px] font-bold text-rose-600 uppercase tracking-wide">Kendala</p>
                                </div>
                                <p class="text-xs text-rose-800 font-medium leading-relaxed">${kendala}</p>
                            </div>
                        ` : `
                            <div class="mt-auto pt-4 border-t border-slate-100 flex items-center text-emerald-600 text-xs font-bold">
                                <i class="fas fa-check-circle mr-2"></i> On Track
                            </div>
                        `}
                    </div>
                `;
                grid.innerHTML += card;
            });

            // Update Header Stats
            summary.innerHTML = `
                <div class="hidden md:block text-right border-r border-slate-200 pr-4 mr-2">
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Total Proker</p>
                    <p class="text-xl font-black text-slate-800">${rows.length}</p>
                </div>
                <div>
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Status Berjalan</p>
                    <div class="flex items-baseline gap-1">
                        <p class="text-xl font-black text-blue-600">${totalActive}</p>
                        <span class="text-xs text-slate-400">/ ${rows.length}</span>
                    </div>
                </div>
            `;

            document.getElementById('timestamp').innerText = 'Last Sync: ' + new Date().toLocaleTimeString('id-ID');
            loading.classList.add('hidden');
            grid.classList.remove('hidden');
        }

        // Init
        fetchSheetData();
        setInterval(fetchSheetData, 30000); // Auto refresh 30 detik
    </script>
</body>
</html>

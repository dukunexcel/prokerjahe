<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Dashboard - Kasir Gemini</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .glass-card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .proker-card { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .proker-card:hover { transform: scale(1.02); }
        .loader { border-top-color: #3b82f6; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-4 md:p-12">

    <div class="max-w-6xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-12 gap-6">
            <div>
                <h1 class="text-4xl font-extrabold text-slate-900 tracking-tight">Proker Dashboard</h1>
                <p class="text-slate-500 mt-2 flex items-center gap-2">
                    <span class="relative flex h-3 w-3">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                    </span>
                    Terkoneksi Langsung ke Google Sheets
                </p>
            </div>
            <div id="summary-box" class="flex gap-4">
                </div>
        </header>

        <div id="loading-state" class="flex flex-col items-center justify-center py-20">
            <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12 mb-4"></div>
            <p class="text-slate-500 animate-pulse">Sinkronisasi data...</p>
        </div>

        <div id="dashboard-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 hidden">
            </div>

        <footer class="mt-20 pt-8 border-t border-slate-200 text-center text-slate-400 text-sm">
            <p>Sistem Pelaporan Otomatis Kasir Gemini &bull; <span id="timestamp"></span></p>
        </div>
    </div>

    <script>
        // Konfigurasi URL Spreadsheet Langsung
        const ssId = '1PVfLmH2ydZDI8VczsXH-PmDu07it7iVgTiwCVE7Z27E';
        const sheetName = 'proker';
        const url = `https://docs.google.com/spreadsheets/d/${ssId}/gviz/tq?tqx=out:json&sheet=${sheetName}`;

        async function fetchSheetData() {
            try {
                const response = await fetch(url);
                const text = await response.text();
                // Google Viz API mengembalikan data dengan prefix, kita hapus agar jadi JSON murni
                const jsonData = JSON.parse(text.substr(47).slice(0, -2));
                renderDashboard(jsonData.table.rows);
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('loading-state').innerHTML = `<p class="text-red-500 font-bold">Gagal memuat data. Pastikan akses Spreadsheet diset ke 'Public'.</p>`;
            }
        }

        function renderDashboard(rows) {
            const grid = document.getElementById('dashboard-grid');
            const summary = document.getElementById('summary-box');
            const loading = document.getElementById('loading-state');
            
            grid.innerHTML = '';
            let totalActive = 0;

            rows.forEach((row, index) => {
                // Mapping data berdasarkan kolom
                const nama = row.c[0] ? row.c[0].v : 'Tanpa Nama';
                const periode = row.c[1] ? row.c[1].v : '-';
                const status = row.c[2] ? row.c[2].v : 'Rencana';
                const kendala = row.c[3] ? row.c[3].v : null;
                const rating = row.c[4] ? row.c[4].v : 0;

                if(status.toLowerCase() === 'berjalan') totalActive++;

                // Star Rating logic
                let stars = '';
                for(let i=1; i<=5; i++) {
                    stars += `<i class="${i <= rating ? 'fas' : 'far'} fa-star text-amber-400 text-[10px]"></i>`;
                }

                const card = `
                    <div class="proker-card glass-card rounded-3xl p-6 shadow-xl shadow-slate-200/50 flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-6">
                                <span class="px-4 py-1.5 rounded-full text-[10px] font-extrabold uppercase tracking-widest ${status.toLowerCase() === 'berjalan' ? 'bg-blue-100 text-blue-600' : 'bg-slate-100 text-slate-500'}">
                                    ${status}
                                </span>
                                <div class="flex gap-1">${stars}</div>
                            </div>
                            <h3 class="text-xl font-extrabold text-slate-800 leading-tight mb-2">${nama}</h3>
                            <div class="flex items-center text-slate-400 text-sm mb-6">
                                <i class="far fa-clock mr-2"></i> ${periode}
                            </div>
                        </div>

                        ${kendala && kendala !== '-' ? `
                            <div class="bg-rose-50 border border-rose-100 p-4 rounded-2xl mt-4">
                                <p class="text-[10px] font-black text-rose-600 uppercase mb-1 tracking-tighter">Issue / Kendala:</p>
                                <p class="text-sm text-rose-900 leading-relaxed font-medium">${kendala}</p>
                            </div>
                        ` : `
                            <div class="h-[1px] bg-slate-100 w-full my-2"></div>
                            <p class="text-xs text-green-500 font-bold"><i class="fas fa-check-circle mr-1"></i> On Schedule</p>
                        `}
                    </div>
                `;
                grid.innerHTML += card;
            });

            // Update Header Stats
            summary.innerHTML = `
                <div class="bg-white px-6 py-3 rounded-2xl border border-slate-100 shadow-sm">
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Total</p>
                    <p class="text-2xl font-black text-slate-900">${rows.length}</p>
                </div>
                <div class="bg-blue-600 px-6 py-3 rounded-2xl shadow-lg shadow-blue-200">
                    <p class="text-[10px] font-bold text-blue-100 uppercase tracking-widest">Berjalan</p>
                    <p class="text-2xl font-black text-white">${totalActive}</p>
                </div>
            `;

            document.getElementById('timestamp').innerText = 'Sync: ' + new Date().toLocaleTimeString('id-ID');
            loading.classList.add('hidden');
            grid.classList.remove('hidden');
        }

        // Jalankan saat load
        fetchSheetData();
        // Refresh tiap 1 menit secara otomatis
        setInterval(fetchSheetData, 60000);
    </script>
</body>
</html>
